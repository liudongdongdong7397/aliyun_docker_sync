name: Upload Local Directory (copy.done trigger)

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  upload:
    runs-on: [self-hosted, Windows]

    steps:
      - name: Check copy.done
        id: check
        shell: powershell
        run: |
          $readyPath = "E:\data\aliyun\data"
          $doneFile = Join-Path $readyPath "copy.done"

          if (!(Test-Path $doneFile)) {
              Write-Output "copy.done not found. Skip."
              exit 0
          }

          Write-Output "copy.done detected."

          echo "READY_PATH=$readyPath" >> $env:GITHUB_OUTPUT

      - name: Compress Directory
        if: steps.check.outputs.READY_PATH != ''
        shell: powershell
        run: |
          $zipPath = "E:\data\aliyun\data\package.zip"

          if (Test-Path $zipPath) {
              Remove-Item $zipPath -Force
          }

          Compress-Archive `
            -Path "${{ steps.check.outputs.READY_PATH }}\*" `
            -DestinationPath $zipPath `
            -Force

          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_OUTPUT

      - name: Upload Artifact
        if: steps.check.outputs.READY_PATH != ''
        uses: actions/upload-artifact@v4
        with:
          name: sync-package
          path: E:\data\aliyun\data\package.zip

      - name: Notify Repo-B
        if: steps.check.outputs.READY_PATH != ''
        shell: powershell
        run: |
          $repoB = "liushiyou006/aliyun_sync"

          $headers = @{
            Authorization = "Bearer $env:PAT_A_TO_B"
            Accept = "application/vnd.github+json"
          }

          $body = @{
            event_type = "sync-artifact"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "https://api.github.com/repos/$repoB/dispatches" `
            -Method Post `
            -Headers $headers `
            -Body $body

        env:
          PAT_A_TO_B: ${{ secrets.PAT_A_TO_B }}

      - name: Cleanup Directory
        if: steps.check.outputs.READY_PATH != ''
        shell: powershell
        run: |
          $readyPath = "E:\data\aliyun\data"
          Remove-Item "$readyPath\*" -Recurse -Force
